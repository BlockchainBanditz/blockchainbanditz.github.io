<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LP Quote</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;padding:24px;max-width:560px;margin:auto}
h1{font-size:28px}.box{background:#1d1d1d;border-radius:14px;padding:18px;margin-top:16px}
input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:0;margin-top:10px;font-size:16px}
button{font-weight:700;cursor:pointer}.muted{color:#aaa;font-size:13px;line-height:1.5;margin-top:10px}
#result{font-size:21px;margin-top:16px;word-break:break-word}
</style>
</head>
<body>
<h1>BUCKX → CRO LP Quote</h1>
<div class="box">
<div>Amount of BUCKX</div>
<input id="amount" type="number" value="8000" step="any">
<button id="btn">Get Live LP Quote</button>
<div id="result">Ready.</div>
<div class="muted">Reads your exact BUCKX/WCRO pair directly from Cronos.<br>No wallet connection. No transaction.</div>
</div>
<script>
const RPC="https://cronos-evm-rpc.publicnode.com";
const PAIR="0x769E02Cb9899b86cdD13670da99c048A4f54F8AF";
const BUCKX="0x58DC82669Ae64878cae2B8A0584179A6b33Bb3D2".toLowerCase();
const WCRO="0x5C7F8A570d578ED84E63fdFA7b1eE72dEae1AE23".toLowerCase();

async function rpcCall(data){
 const r=await fetch(RPC,{method:"POST",headers:{"content-type":"application/json"},
 body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",params:[{to:PAIR,data},"latest"]})});
 if(!r.ok) throw new Error("RPC HTTP "+r.status);
 const j=await r.json();
 if(j.error) throw new Error(j.error.message||"RPC error");
 return j.result;
}
function addr(x){return "0x"+x.slice(-40).toLowerCase();}
function fmt(n,d=2){return n.toLocaleString(undefined,{maximumFractionDigits:d});}

async function quote(){
 const out=document.getElementById("result");
 out.textContent="Reading your LP…";
 const n=Number(document.getElementById("amount").value);
 if(!(n>0)){out.textContent="Enter an amount.";return;}
 try{
  const [t0,t1,raw]=await Promise.all([
   rpcCall("0x0dfe1681"),
   rpcCall("0xd21220a7"),
   rpcCall("0x0902f1ac")
  ]);
  if(typeof raw!=="string" || raw.length<194) throw new Error("Pool did not return reserves.");
  const token0=addr(t0), token1=addr(t1);
  const r0=BigInt("0x"+raw.slice(2,66));
  const r1=BigInt("0x"+raw.slice(66,130));
  let buck,wcro;
  if(token0===BUCKX && token1===WCRO){buck=r0;wcro=r1;}
  else if(token0===WCRO && token1===BUCKX){buck=r1;wcro=r0;}
  else throw new Error("Pair tokens do not match BUCKX/WCRO.");
  const input=BigInt(Math.floor(n*1e18));
  const output=(input*997n*wcro)/(buck*1000n+input*997n);
  const received=Number(output)/1e18;
  const spot=Number(wcro)/Number(buck);
  const spotOut=n*spot;
  const impact=(1-received/spotOut)*100;
  out.innerHTML="<b>"+fmt(n,4)+" BUCKX → "+received.toFixed(8)+" WCRO (≈ CRO)</b>"+
   '<div class="muted">Pool spot: 1 WCRO ≈ '+fmt(1/spot,2)+' BUCKX<br>'+
   'Estimated price impact: '+impact.toFixed(2)+'%<br>Fee assumption: 0.30%</div>';
 }catch(e){out.innerHTML="<b>Quote failed</b><div class='muted'>"+e.message+"</div>";}
}
document.getElementById("btn").addEventListener("click",quote);
</script>
</body>
</html>
