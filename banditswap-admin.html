<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BanditSwap Admin</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:20px}.box{max-width:650px;margin:auto;background:#151515;border:1px solid #6f5a1e;border-radius:18px;padding:20px}h1{color:#f9e27d}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;background:#090909;color:#fff;border:1px solid #444;border-radius:10px}button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;font-weight:700;background:#f1d45a;color:#111}.secondary{background:#222;color:#f9e27d;border:1px solid #6f5a1e}.item{padding:10px 0;border-bottom:1px solid #333;font-size:13px;word-break:break-all}.note{color:#aaa;font-size:13px;line-height:1.5}.ok{color:#9be59b}</style></head><body><div class="box"><h1>BanditSwap Admin</h1><p class="note">Add tokens to the public BanditSwap list. This page never stores a GitHub password or access token. After editing, download the JSON file and upload it to your repository as <b>banditswap-tokens.json</b>.</p><input id="name" placeholder="Token name"><input id="symbol" placeholder="Symbol"><input id="address" placeholder="Cronos contract address (0x...)"><input id="decimals" type="number" min="0" max="18" placeholder="Decimals (usually 18)"><button onclick="add()">Add Token</button><button class="secondary" onclick="download()">Download Public Token List</button><div id="msg" class="note"></div><h3>Current custom tokens</h3><div id="list"></div></div><script>let tokens=[];async function init(){try{let r=await fetch('banditswap-tokens.json?'+Date.now());tokens=await r.json();if(!Array.isArray(tokens))tokens=[]}catch{tokens=[]}render()}function render(){list.innerHTML=tokens.map((t,i)=>`<div class="item"><b>${t.symbol}</b> — ${t.name}<br>${t.address}<br>Decimals: ${t.decimals}</div>`).join('')}function add(){let n=name.value.trim(),s=symbol.value.trim().toUpperCase(),a=address.value.trim(),d=Number(decimals.value);if(!n||!s||!/^0x[a-fA-F0-9]{40}$/.test(a)||!Number.isInteger(d)||d<0||d>18){msg.textContent='Enter valid token details.';return}if(tokens.some(t=>t.address.toLowerCase()===a.toLowerCase())){msg.textContent='That contract is already listed.';return}tokens.push({name:n,symbol:s,address:a,decimals:d});name.value=symbol.value=address.value=decimals.value='';msg.innerHTML='<span class="ok">Added. Download the updated JSON and upload it to GitHub.</span>';render()}function download(){let blob=new Blob([JSON.stringify(tokens,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='banditswap-tokens.json';a.click();URL.revokeObjectURL(u)}init();</script></body></html>
