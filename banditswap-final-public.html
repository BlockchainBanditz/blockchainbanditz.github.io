  background:

.logo{

  font-size:25px;

  -webkit-text-fill-color:transparent

.nav{

  gap:8px;

  color:#fff;
  text-decoration:none;
  border:1px solid var(--line);
  padding:9px 13px;

.wrap{

.hero{

  margin:0 0 8px;

.hero p{

.panel{

.arrow{

.arrow button,

  font-weight:700;

}

.arrow button{
  background:#111;

}

.primary{
  width:100%;

  background:linear-gradient(135deg,var(--gold),var(--gold2));

}

.status,
.quote,
.review{
  display:none;
  margin-top:14px;

.review h3{

}

.review .line{
  display:flex;

  gap:15px;
  margin:8px 0
}

.review small{
  color:#999
}

.wallet{
  margin-top:14px;
  text-align:center;
  color:#aaa;
  font-size:12px;
  word-break:break-all
}

.foot{
  text-align:center;
  color:#777;
  font-size:11px;
  margin:25px 0
}

.ok{
  color:#9be59b
}

@media(max-width:620px){

  header{
    padding:16px
  }

  .wrap{
    margin-top:25px
  }

  .hero h1{
    font-size:34px
  }

  .row{
    align-items:stretch
  }

  .token-select{
    max-width:150px
  }

  .amount{
    font-size:25px
  }
}
</style>
</head>

<header>
  <div class="logo">BanditSwap</div>

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="banditswap-final-public.html">BanditSwap</a>
  </nav>
</header>

<main class="wrap">

<section class="hero">
  <h1>BanditSwap</h1>
  <p>Direct Cronos swaps through the VVS V2 router.</p>

<section class="panel">

<button

      id="fromAmount"

      id="fromToken"
      class="token-select">

</div>

<div class="arrow">

  <button
    type="button"
    onclick="flipTokens()">
    ↕
  </button>

<div class="token-box">

  <div class="row">

    <span class="label">You receive</span>

    <span
      class="label"
      id="toBalance"
      style="margin-left:auto">
      Balance —
    </span>

  </div>

  <div class="row">

    <input
      id="toAmount"
      class="amount"
      placeholder="0.0"

  No transaction is sent until you approve the final wallet confirmation.
  Token approvals are requested only when needed.
</p>

</section>

</main>

<script>

/* =====================================================
   CORE SETTINGS
   ===================================================== */

const RPC =
'https://evm.cronos.com';

const ROUTER =
'0x145863Eb42Cf62847A6Ca784e6416C1682b1b2Ae';

const WCRO =
'0x5C7F8A570d578ED84E63fdFA7b1eE72dEae1AE23'
.toLowerCase();

const CHAIN_ID =
'0x19';

const SLIPPAGE_BPS =
100;

const DEADLINE_SECONDS =
1200;


/* =====================================================
   VARIABLES
   ===================================================== */

let walletProvider = null;
let walletAddress = null;

let pending = null;
let lastPath = null;
let lastQuote = null;

let publicTokens = [];


/* =====================================================
   DOM HELPER
   ===================================================== */

const $ =
id => document.getElementById(id);


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function esc(s){

return String(s).replace(
/[&<>"']/g,

m => ({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])

);

}


/* =====================================================
   TOKEN LIST
   ===================================================== */

function tokens(){

return Array.isArray(publicTokens)
? publicTokens
: [];

}


/* =====================================================
   POPULATE DROPDOWNS
   ===================================================== */

function populate(){

let ts = tokens();

let a = $('fromToken');
let b = $('toToken');

if(!a || !b)
return;

a.innerHTML = '';
b.innerHTML = '';

ts.forEach(t => {

a.add(
new Option(
t.symbol+' — '+t.name,
t.symbol
)
);

b.add(
new Option(
t.symbol+' — '+t.name,
t.symbol
)
);

});

if(
ts.some(t => t.symbol === 'CRO')
)
a.value = 'CRO';

if(
ts.some(t => t.symbol === 'BUCKX')
)
b.value = 'BUCKX';

}


/* =====================================================
   LOAD PUBLIC TOKEN JSON
   ===================================================== */

async function loadPublicTokens(){

try{

let r =
await fetch(
'./banditswap-tokens.json?'+Date.now(),
{cache:'no-store'}
);

if(!r.ok)
throw new Error('Token list unavailable');

let x =
await r.json();

if(Array.isArray(x)){

publicTokens = x;

}else if(
x &&
Array.isArray(x.tokens)
){

publicTokens = x.tokens;

}else{

throw new Error('Invalid token list.');

}

populate();

}catch(e){

publicTokens = [];

populate();

show(
'Token list could not be loaded.'
);

console.error(
'BanditSwap token list error:',
e
);

}

}


/* =====================================================
   SWAP HELPERS
   ===================================================== */

function flipTokens(){

let a =
$('fromToken').value;

let b =
$('toToken').value;

$('fromToken').value =
b;

$('toToken').value =
a;

clearPrepared();

updateBalances();

}


function show(t){

let e =
$('status');

e.style.display =
'block';

e.textContent =
t;

}


function clearPrepared(){

pending = null;

$('review').style.display =
'none';

$('continueBtn').style.display =
'none';

$('toAmount').value =
'';

}


function pad(x){

return String(x)
.replace(/^0x/,'')
.padStart(64,'0');

}


function addr(a){
return pad(a);
}


function uint(x){

return pad(
BigInt(x).toString(16)
);

}


function deadline(){

return BigInt(
Math.floor(
Date.now()/1000
) +
DEADLINE_SECONDS
);

}


/* =====================================================
   RPC
   ===================================================== */

async function rpc(
method,
params=[]
){

let r =
await fetch(
RPC,
{
method:'POST',
headers:{
'content-type':
'application/json'
},
body:
JSON.stringify({
jsonrpc:'2.0',
id:Date.now(),
method:method,
params:params
})
}
);

let j =
await r.json();

if(j.error)
throw Error(
j.error.message ||
method+
' failed'
);

return j.result;

}


async function call(
to,
data
){

return rpc(
'eth_call',
[
{
to:to,
data:data
},
'latest'
]
);

}


/* =====================================================
   VVS ROUTER QUOTES
   ===================================================== */

function encodePath(
path,
offset
){

return (
pad(offset) +
uint(path.length) +
path.map(addr).join('')
);

}


function encodeGetAmountsOut(
amount,
path
){

return (
'0xd06ca61f' +
uint(amount) +
encodePath(
path,
'40'
)
);

}


async function routerQuote(
amount,
path
){

let raw =
await call(
ROUTER,
encodeGetAmountsOut(
amount,
path
)
);

let len =
parseInt(
raw.slice(66,130),
16
);

if(!len)
throw Error(
'No VVS route for this pair.'
);

return BigInt(
'0x'+
raw.slice(130,194)
);

}


/* =====================================================
   TOKEN METADATA
   ===================================================== */

function meta(symbol){

let t =
tokens().find(
x =>
x.symbol === symbol
);

if(!t)
throw Error(
'Token not found.'
);

return t;

}


async function decimalsOf(t){

if(
t.address === 'native'
)
return 18;

if(
t.decimals != null
)
return Number(t.decimals);

let raw =
await call(
t.address,
'0x313ce567'
);

let d =
Number(
BigInt(raw)
);

t.decimals =
d;

return d;

}


/* =====================================================
   UNITS
   ===================================================== */

function parseUnits(
s,
d
){

s =
String(s).trim();

if(
! /^\d+(\.\d+)?$/.test(s)
)
throw Error(
'Enter a valid amount.'
);

let [w,f=''] =
s.split('.');

if(
f.length > d
)
throw Error(
'Too many decimal places for this token.'
);

return (
BigInt(w) *
(10n ** BigInt(d))
+
BigInt(
(f+
'0'.repeat(d))
.slice(0,d)
)
);

}


function formatUnits(
v,
d
){

let n =
BigInt(v);

let base =
10n ** BigInt(d);

let w =
n/base;

let f =
(n%base)
.toString()
.padStart(d,'0')
.replace(/0+$/,'');

return f
? w+'.'+f
: w.toString();

}


/* =====================================================
   PATH FINDING
   ===================================================== */

function bestPath(
from,
to
){

let f =
meta(from);

let t =
meta(to);

if(
f.address === 'native' &&
t.address === 'native'
)
throw Error(
'Choose two different tokens.'
);

if(
f.address === 'native'
)
return [
[
WCRO,
t.address.toLowerCase()
]
];

if(
t.address === 'native'
)
return [
[
f.address.toLowerCase(),
WCRO
]
];

if(
f.address.toLowerCase() ===
t.address.toLowerCase()
)
throw Error(
'Choose two different tokens.'
);

return [

[
f.address.toLowerCase(),
t.address.toLowerCase()
],

[
f.address.toLowerCase(),
WCRO,
t.address.toLowerCase()
]

];

}


async function bestQuote(
amount,
paths
){

let best =
null;

for(
let p of paths
){

try{

let q =
await routerQuote(
amount,
p
);

if(
q > 0n &&
(
!best ||
q > best.q
)
){

best = {
q:q,
path:p
};

}

}catch(e){}

}

if(!best)
throw Error(
'VVS could not find a route for this pair.'
);

return best;

}


function fmtAmount(
v,
d
){

return formatUnits(
v,
d
);

}


/* =====================================================
   LIVE QUOTE
   ===================================================== */

async function refreshQuote(){

clearPrepared();

let amount =
$('fromAmount')
.value
.trim();

let f =
$('fromToken')
.value;

let t =
$('toToken')
.value;

if(
!amount ||
Number(amount) <= 0
){

show(
'Enter an amount first.'
);

return;

}

try{

let fm =
meta(f);

let tm =
meta(t);

let fd =
await decimalsOf(f);

let td =
await decimalsOf(tm);

let input =
parseUnits(
amount,
fd
);

let paths =
bestPath(f,t);

let best =
await bestQuote(
input,
paths
);

lastPath =
best.path;

lastQuote =
best.q;

$('toAmount').value =
fmtAmount(
best.q,
td
);

$('quoteBox').style.display =
'block';

$('quoteBox').innerHTML =
'<b>Live VVS router quote</b><br>'+
esc(amount)+
' '+
esc(f)+
' → '+
esc(
fmtAmount(
best.q,
td
)
)+
' '+
esc(t)+
'<br><small>Route: '+
esc(
best.path.map(
x =>
x === WCRO
? 'WCRO'
: x
).join(' → ')
)+
' • same router used for execution • no transaction sent.</small>';

show(
'Quote ready.'
);

}catch(e){

$('quoteBox').style.display =
'block';

$('quoteBox').innerHTML =
'<b>Quote failed</b><br>'+
esc(e.message);

show(
'No transaction was sent.'
);

}

}


/* =====================================================
   WALLET
   ===================================================== */

async function connectWallet(){

if(!window.ethereum){

show(
'No injected wallet detected. Open this page in MetaMask or Crypto.com Onchain Wallet.'
);

return;

}

try{

walletProvider =
window.ethereum;

let c =
await walletProvider.request({
method:'eth_chainId'
});

if(
c.toLowerCase() !==
CHAIN_ID
){

await walletProvider.request({
method:
'wallet_switchEthereumChain',

params:[
{
chainId:CHAIN_ID
}
]

});

}

let a =
await walletProvider.request({
method:'eth_requestAccounts'
});

walletAddress =
a[0];

$('walletBtn').textContent =
'Wallet Connected';

$('walletLine').style.display =
'block';

$('walletLine').textContent =
walletAddress;

show(
'Wallet connected on Cronos Mainnet.'
);

await updateBalances();

}catch(e){

show(
e.message ||
String(e)
);

}

}


async function wreq(
method,
params=[]
){

if(!walletProvider)
throw Error(
'Connect your wallet first.'
);

return walletProvider.request({
method:method,
params:params
});

}


/* =====================================================
   BALANCES
   ===================================================== */

async function balance(t){

if(!walletAddress)
return null;

if(
t.address === 'native'
){

return BigInt(
await wreq(
'eth_getBalance',
[
walletAddress,
'latest'
]
)
);

}

return BigInt(
await wreq(
'eth_call',
[
{
to:t.address,
data:
'0x70a08231'+
addr(walletAddress)
},
'latest'
]
)
);

}


async function updateBalances(){

if(!walletAddress)
return;

try{

let f =
meta(
$('fromToken').value
);

let t =
meta(
$('toToken').value
);

let fd =
await decimalsOf(f);

let td =
await decimalsOf(t);

$('fromBalance').textContent =
'Balance '+
formatUnits(
await balance(f),
fd
);

$('toBalance').textContent =
'Balance '+
formatUnits(
await balance(t),
td
);

}catch(e){}

}


/* =====================================================
   APPROVAL
   ===================================================== */

function allowanceData(
owner,
spender
){

return (
'0xdd62ed3e'+
addr(owner)+
addr(spender)
);

}


async function allowance(t){

return BigInt(
await wreq(
'eth_call',
[
{
to:t.address,
data:
allowanceData(
walletAddress,
ROUTER
)
},
'latest'
]
)
);

}


function approveData(
amount
){

return (
'0x095ea7b3'+
addr(ROUTER)+
uint(amount)
);

}


/* =====================================================
   SWAP DATA
   ===================================================== */

function swapTokenToEth(
amount,
min,
path,
to,
dl
){

return (
'0x791ac947'+
uint(amount)+
uint(min)+
pad('a0')+
addr(to)+
uint(dl)+
uint(path.length)+
path.map(addr).join('')
);

}


function swapTokenToToken(
amount,
min,
path,
to,
dl
){

return (
'0x5c11d795'+
uint(amount)+
uint(min)+
pad('a0')+
addr(to)+
uint(dl)+
uint(path.length)+
path.map(addr).join('')
);

}


function swapEthToToken(
min,
path,
to,
dl
){

return (
'0x7ff36ab5'+
uint(min)+
pad('80')+
addr(to)+
uint(dl)+
uint(path.length)+
path.map(addr).join('')
);

}


/* =====================================================
   SIMULATE + GAS
   ===================================================== */

async function simulateAndGas(tx){

await wreq(
'eth_call',
[
tx,
'latest'
]
);

let gas =
BigInt(
await wreq(
'eth_estimateGas',
[tx]
)
);

let gp =
BigInt(
await wreq(
'eth_gasPrice',
[]
)
);

return {
gas:gas,
fee:gas*gp
};

}


/* =====================================================
   PREPARE SWAP
   ===================================================== */

async function prepareSwap(){

clearPrepared();

if(!walletAddress){

await connectWallet();

if(!walletAddress)
return;

}

let amount =
$('fromAmount')
.value
.trim();

let f =
$('fromToken')
.value;

let t =
$('toToken')
.value;

if(
!amount ||
Number(amount)<=0
){

show(
'Enter an amount first.'
);

return;

}

try{

let fm =
meta(f);

let tm =
meta(t);

let fd =
await decimalsOf(fm);

let td =
await decimalsOf(tm);

let input =
parseUnits(
amount,
fd
);

let paths =
bestPath(f,t);

let best =
await bestQuote(
input,
paths
);

let min =
(
best.q *
(10000n-SLIPPAGE_BPS)
) /
10000n;

let dl =
deadline();

let tx = {
from:walletAddress,
to:ROUTER,
value:'0x0'
};

let needsApproval =
fm.address !== 'native';


if(needsApproval){

let al =
await allowance(fm);

if(al < input){

show(
'Approval required for '+
f+
'. Your wallet will ask you to approve the token first.'
);

let ah =
await wreq(
'eth_sendTransaction',
[
{
from:walletAddress,
to:fm.address,
data:approveData(input),
value:'0x0'
}
]
);

show(
'Approval sent. Waiting for confirmation…'
);

await waitReceipt(ah);

}

}


if(
fm.address === 'native'
){

tx.value =
'0x'+
input.toString(16);

tx.data =
swapEthToToken(
min,
best.path,
walletAddress,
dl
);

}else if(
tm.address === 'native'
){

tx.data =
swapTokenToEth(
input,
min,
best.path,
walletAddress,
dl
);

}else{

tx.data =
swapTokenToToken(
input,
min,
best.path,
walletAddress,
dl
);

}


show(
'Simulating exact executable route…'
);

let g =
await simulateAndGas(tx);

tx.gas =
'0x'+
g.gas.toString(16);

let outText =
fmtAmount(
best.q,
td
);

let minText =
fmtAmount(
min,
td
);

let feeText =
formatUnits(
g.fee,
18
);

pending = {

tx:tx,

trade:
amount+
' '+
f+
' → '+
t,

output:
outText+
' '+
t,

minOut:
minText+
' '+
t,

fee:
feeText,

path:
best.path,

outputRaw:
best.q

};


$('review').style.display =
'block';

$('review').innerHTML =

'<h3>Swap ready — review before wallet confirmation</h3>'+

'<div class="line">'+
'<span>Trade</span>'+
'<b>'+
esc(pending.trade)+
'</b>'+
'</div>'+

'<div class="line">'+
'<span>Expected output</span>'+
'<b>'+
esc(pending.output)+
'</b>'+
'</div>'+

'<div class="line">'+
'<span>Minimum protected output</span>'+
'<b>'+
esc(pending.minOut)+
'</b>'+
'</div>'+

'<div class="line">'+
'<span>Estimated network fee</span>'+
'<b>'+
esc(feeText)+
' CRO</b>'+
'</div>'+

'<small>Route: '+
esc(
best.path.map(
x =>
x===WCRO
? 'WCRO'
: x
).join(' → ')
)+
'<br>Simulation passed. Nothing has been sent.</small>';


$('continueBtn').style.display =
'block';

show(
'Simulation passed. Review the fee and trade before continuing.'
);


}catch(e){

show(
'Swap stopped: '+
(e.message||String(e))+
' No swap was sent unless an approval was already confirmed.'
);

}

}


/* =====================================================
   CONTINUE TO WALLET
   ===================================================== */

async function continueToWallet(){

if(!pending){

show(
'No prepared swap.'
);

return;

}

let p =
pending;

pending = null;

$('continueBtn').disabled =
true;

$('continueBtn').textContent =
'Opening Wallet…';

try{

let h =
await wreq(
'eth_sendTransaction',
[p.tx]
);

show(
'Swap submitted. Waiting for confirmation…'
);

await waitReceipt(h);

$('review').innerHTML +=

'<div class="ok" style="margin-top:12px">'+
'Swap confirmed. Tx: '+
esc(h)+
'</div>';

$('continueBtn').style.display =
'none';

await updateBalances();

}catch(e){

show(
'Wallet/swap stopped: '+
(e.message||String(e))
);

$('continueBtn').disabled =
false;

$('continueBtn').textContent =
'Continue to Wallet';

pending = p;

}

}


/* =====================================================
   WAIT FOR RECEIPT
   ===================================================== */

async function waitReceipt(h){

for(
let i=0;
i<90;
i++
){

let r =
await wreq(
'eth_getTransactionReceipt',
[h]
);

if(r){

if(
r.status === '0x0'
)
throw Error(
'Transaction reverted.'
);

return r;

}

await new Promise(
r =>
setTimeout(r,2000)
);

}

throw Error(
'Confirmation timed out. Check Cronos Explorer.'
);

}

   EVENTS
   ===================================================== */

$('fromAmount')
.addEventListener(
'input',
clearPrepared
);

$('fromToken')
.addEventListener(
'change',
()=>{

clearPrepared();

updateBalances();

}
);

$('toToken')
.addEventListener(
'change',
()=>{

clearPrepared();

updateBalances();

}
);

   START

loadPublicTokens();
