<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIC Universe </title>
<link href="https://fonts.cdnfonts.com/css/sprite-graffiti" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap');
:root { --gold: linear-gradient(135deg, #d4af37, #f9e27d); }
body { margin:0; font-family:'Poppins',sans-serif; background:radial-gradient(circle at 20% 20%,rgba(212,175,55,.08),transparent),radial-gradient(circle at 80% 80%,rgba(255,255,255,.05),transparent),#000; color:white; overflow-x:hidden; }
/* LOADER */
.loader { position:fixed; inset:0; background:black; display:flex; justify-content:center; align-items:center; font-family:'Sprite Graffiti',cursive; font-size:40px; color:gold; z-index:9999; animation:fadeOut 1s ease forwards; animation-delay:2s; }
@keyframes fadeOut { to { opacity:0; visibility:hidden; } }
/* PARTICLES */
canvas { position:fixed; top:0; left:0; z-index:0; pointer-events:none; }
/* GLOW */
.glow { position:fixed; width:500px; height:500px; background:radial-gradient(circle,rgba(212,175,55,.15),transparent 60%); pointer-events:none; border-radius:50%; transform:translate(-50%,-50%); z-index:1; }
/* NAV */
header { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:20px 40px; border-bottom:1px solid rgba(212,175,55,.3); backdrop-filter:blur(10px); position:relative; z-index:2; }
.logo { font-family:'Sprite Graffiti',cursive; font-size:24px; background:var(--gold); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
nav { display:flex; flex-wrap:wrap; justify-content:center; }
nav a { margin:0 15px; color:white; text-decoration:none; cursor:pointer; }
nav a:hover { color:#f9e27d; }
/* PAGES */
.page { display:none; }
.page.active { display:block; }
/* HERO */
.hero { text-align:center; padding:120px 20px; position:relative; z-index:2; }
.hero h1 { font-family:'Sprite Graffiti',cursive; font-size:clamp(42px,7vw,70px); background:var(--gold); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shine 6s linear infinite; background-size:200% 200%; }
.tagline { letter-spacing:10px; opacity:.7; }
.subtitle { color:#ccc; }
.gold-btn { background:var(--gold); color:black; padding:15px 30px; border-radius:30px; cursor:pointer; border:none; margin:10px; font-weight:bold; }
.gold-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
/* SECTION */
.section { padding:80px 20px; text-align:center; position:relative; z-index:2; }
.section h2 { font-family:'Playfair Display',serif; color:#f5d97a; font-size:clamp(28px,4vw,38px); }
.grid { display:flex; gap:30px; justify-content:center; flex-wrap:wrap; }
.card { background:rgba(255,255,255,.03); border:1px solid rgba(212,175,55,.3); border-radius:15px; padding:20px; width:240px; transition:.3s; box-sizing:border-box; }
.card:hover { transform:scale(1.05); box-shadow:0 20px 50px rgba(212,175,55,.3); }
.team-card { cursor:pointer; }
.team-card:hover { border-color:#f9e27d; transform:scale(1.08); }
.card img { display:block; width:100%; aspect-ratio:4 / 5; object-fit:cover; object-position:center; border-radius:10px; background:#111; }
.card h3 { font-family:'Sprite Graffiti',cursive; color:#f5d97a; }
.meta { font-size:12px; color:#d4af37; }
